[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-classifier"
version = "1.0.0"
description = "Train and serve a deep-learning fashion product image classifier"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "pillow>=10.3",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.4",
  "streamlit>=1.32",
  "torch>=2.2",
  "torchvision>=0.17",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
